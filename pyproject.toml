[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chronicle"
version = "0.1.0"
description = "Temporal memory and reasoning toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Opustron" }]
dependencies = [
  "pydantic>=2.6",
  "python-dateutil>=2.9",
  "dateparser>=1.2",
  "openai>=1.40",
  "pyyaml>=6.0",
  "icalendar>=5.0",
  "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["chronicle"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
